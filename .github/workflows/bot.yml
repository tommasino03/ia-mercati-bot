name: Telegram Bot Intraday Alert

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"   # ogni ora

jobs:
  intraday:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install python-telegram-bot yfinance matplotlib

      - name: Run intraday bot
        run: python bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
