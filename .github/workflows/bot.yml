name: Esegui Bot Mercati

on:
  schedule:
    - cron: "0 9 * * *"  # Ogni giorno alle 09:00 UTC
  workflow_dispatch:  # Permette anche l'esecuzione manuale

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'  # Compatibile con le librerie del bot

      - name: Install dipendenze minime
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy python-telegram-bot==20.4

      - name: Esegui bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot.py
