name: Run Bot

# Trigger del workflow
on:
  push:
    branches:
      - main      # esegue su ogni push sul branch main
  workflow_dispatch:  # permette di eseguirlo manualmente dal tasto "Run workflow"
  schedule:
    - cron: '0 * * * *'  # opzionale: esegue ogni ora (puoi modificare il cron)

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.12

    - name: Upgrade pip
      run: python -m pip install --upgrade pip

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Run bot
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
      run: python bot.py
