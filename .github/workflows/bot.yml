name: IA Mercati - Report Giornaliero

# Esecuzione automatica ogni giorno alle 9:00 italiane + possibilità di esecuzione manuale
on:
  schedule:
    - cron: "0 7 * * *"   # 9:00 ITA (UTC)
  workflow_dispatch:

jobs:
  send-report:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout del repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Imposta Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3️⃣ Installa librerie necessarie
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-telegram-bot yfinance pandas requests

      # 4️⃣ Esegui il bot per generare il report
      - name: Generate and send report
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot.py
