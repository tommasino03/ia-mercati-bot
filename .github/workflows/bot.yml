steps:
  - uses: actions/checkout@v3

  - name: Set up Python
    uses: actions/setup-python@v4
    with:
      python-version: '3.12'

  - name: Install dependencies
    run: |
      pip install --upgrade pip
      pip install "python-telegram-bot[webhooks]"
      
  - name: Run bot
    run: python bot.py
